name: bytepulse_ai_flutter
description: "BytePulse AI — Developer Intelligence Suite built with Flutter & Riverpod"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.0
  http: ^1.2.0
  url_launcher: ^6.3.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.0
  xml: ^6.5.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
